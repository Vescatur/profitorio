[recipe-description]
customer-new=A customer walks in.
buy_wood=Buy wood with pennies.
buy_iron-ore=Buy iron ore with pennies. Smelt it into plates yourself.
buy_copper-ore=Buy copper ore with silver. Circuits need copper and a lab needs circuits, so this is the purchase that opens the technology tree.
buy_coal=Buy coal by the hundred with banknotes. Nothing burns it — it is chemistry, not fuel.
buy_stone=Buy stone with pennies.
buy_crude-oil-barrel=Buy crude oil by the barrel with banknotes. Empty a barrel to keep it.
exchange_silver_coin_penny=Break a Silver Coin into pennies at the Import. The shop keeps a cut, so change is always worse than earning the pennies yourself.
exchange_banknote_silver_coin=Break a Banknote into silver. Change never goes the other way: a coin is earned from a customer, never assembled from smaller ones.
exchange_bond_banknote=Break a Bond into banknotes.
exchange_gold_bar_bond=Break a Gold Bar into bonds.
exchange_diamond_gold_bar=Break a Diamond into gold.

; The five technologies named after a denomination no longer unlock a science
; pack recipe -- those are gone, money is earned rather than crafted. Four of
; them are trading licences instead: they unlock the delivery recipes of their
; band, so researching one is what lets you serve that tier of customer at all.
; The Penny is the exception and stays effect-less: the penny band ships enabled,
; because every technology in the game is downstream of the first delivery.
[technology-name]
automation-science-pack=The Penny
logistic-science-pack=The Silver Coin
chemical-science-pack=The Banknote
production-science-pack=The Bond
utility-science-pack=The Gold Bar

[technology-description]
automation-science-pack=Start taking money for your work. Opens the research that pennies can pay for.
logistic-science-pack=A licence to deal in silver. Lets you serve the silver customers, and opens the research priced in silver coins.
chemical-science-pack=A licence to deal in paper money. Lets you serve the banknote customers, and opens the research priced in banknotes.
production-science-pack=A licence to issue debt against the factory. Lets you serve the bond customers, and opens the research priced in bonds.
utility-science-pack=A licence to hold a gold reserve. Lets you serve the gold customers, and opens the research priced in gold bars.

