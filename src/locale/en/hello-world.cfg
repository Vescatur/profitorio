[entity-description]
entrance=Customers arrive here. Only one Entrance can exist in the factory.
lab=Turns money into progress. Research is priced in currency, so every technology is an invoice.
loader=Moves goods between a belt and an Import or an Export, in a single tile. It attaches to nothing else. Takes no power, like everything else here.
fast-loader=Moves goods between a belt and an Import or an Export, in a single tile, at the speed of a fast belt.
express-loader=Moves goods between a belt and an Import or an Export, in a single tile, at the speed of an express belt.
loader-1x2-stub=Not obtainable. A leftover the engine insists on.

[item-description]
entrance=Customers arrive here. Only one Entrance can exist in the factory.
customer_review=What a customer leaves behind five minutes after arriving. It never decays and nothing will take it.
customer_diamond=A client who wants a rocket launched. Build a satellite around them and send it up: the launch pays in diamonds. Leaves a review five minutes after arriving, served or not.
customer_burner-inserter=An order for burner inserters, paid in pennies. Leaves a review five minutes after arriving, served or not.
customer_assembling-machine-1=An order for basic assembling machines, paid in pennies. Leaves a review five minutes after arriving, served or not.
customer_transport-belt=An order for transport belts, paid in pennies, with a silver coin on top. Leaves a review five minutes after arriving, served or not.
customer_inserter=An order for inserters, paid in silver. Requires The Silver Coin. Leaves a review five minutes after arriving, served or not.
customer_splitter=An order for splitters, paid in silver. Requires The Silver Coin. Leaves a review five minutes after arriving, served or not.
customer_assembling-machine-2=An order for assembling machines, paid in silver, with a banknote on top. Requires The Silver Coin. Leaves a review five minutes after arriving, served or not.
customer_bulk-inserter=An order for bulk inserters, paid in banknotes. Requires The Banknote. Leaves a review five minutes after arriving, served or not.
customer_electric-furnace=An order for electric furnaces, paid in banknotes. Requires The Banknote. Leaves a review five minutes after arriving, served or not.
customer_productivity-module=An order for productivity modules, paid in banknotes, with a bond on top. Requires The Banknote. Leaves a review five minutes after arriving, served or not.
customer_construction-robot=An order for construction robots, paid in bonds. Requires The Bond. Leaves a review five minutes after arriving, served or not.
customer_logistic-robot=An order for logistic robots, paid in bonds. Requires The Bond. Leaves a review five minutes after arriving, served or not.
customer_roboport=An order for roboports, paid in bonds, with a gold bar on top. Requires The Bond. Leaves a review five minutes after arriving, served or not.
customer_express-transport-belt=An order for express transport belts, paid in gold. Requires The Gold Bar. Leaves a review five minutes after arriving, served or not.
customer_beacon=An order for beacons, paid in gold. Requires The Gold Bar. Leaves a review five minutes after arriving, served or not.
customer_productivity-module-3=An order for productivity modules, paid in gold. Requires The Gold Bar. Leaves a review five minutes after arriving, served or not. Serving one may bring in a client who wants a rocket launched.
lab=Turns money into progress. Research is priced in currency, so every technology is an invoice.
automation-science-pack=Loose change. The base denomination: customers pay in pennies and every purchase is settled in them.
logistic-science-pack=Struck silver. Worth a stack of pennies, and the price of anything past the first few technologies.
chemical-science-pack=Paper money. Worth far more than the metal it is printed on, and only earned from serious orders.
production-science-pack=A sealed certificate of debt. Industrial money, backed by the factory itself.
utility-science-pack=A cast ingot of gold. Reserve currency, not pocket money.
space-science-pack=Compressed wealth. The largest denomination there is.

